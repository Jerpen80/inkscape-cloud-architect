      label_prefix: ''
      padding:
        top: 70
        bottom: 50
        sides: 15
      stroke_color: '#00a4a6'
      stroke_width: 0.5
      stroke_dasharray: 8,8
    legend:
      icon_scale: 1.0
      font_size: 15
      item_gap: 30
      row_gap: 15
      section_gap: 25
      top_spacing: 60
      swatch_width: 40
      swatch_height: 20
